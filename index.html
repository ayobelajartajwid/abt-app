    <script type="text/babel">
        const SUPABASE_URL = "https://qhiaawsvsilwynreerdm.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoaWFhd3N2c2lsd3lucmVlcmRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzgxMzksImV4cCI6MjEwODUxNDEzOX0.V56bbVi7usxoPXNpgUJQHETJ4j3FOz0dzuk5FMqPKbg";

        // Data Provinsi dan Kota Lengkap di Indonesia

            "Sumatera Utara": ["Medan", "Binjai", "Pematangsiantar", "Tanjungbalai", "Tebing Tinggi", "Padang Sidempuan"],

            "Bengkulu": ["Bengkulu"],
            "Lampung": ["Bandar Lampung", "Metro"],

            "Jawa Timur": ["Surabaya", "Malang", "Sidoarjo", "Jember", "Kediri", "Madiun", "Blitar", "Probolinggo", "Banyuwangi"],
            "Banten": ["Tangerang", "Serang", "Cilegon", "Tangerang Selatan"],
            "Bali": ["Denpasar", "Singaraja", "Ubud"],
            "Nusa Tenggara Barat": ["Mataram", "Bima"],
            "Nusa Tenggara Timur": ["Kupang", "Maumere"],
            "Kalimantan Barat": ["Pontianak", "Singkawang"],
            "Kalimantan Tengah": ["Palangka Raya"],
            "Kalimantan Selatan": ["Banjarmasin", "Banjarbaru"],
            "Kalimantan Timur": ["Samarinda", "Balikpapan", "Bontang"],
            "Kalimantan Utara": ["Tarakan"],
            "Sulawesi Utara": ["Manado", "Bitung", "Tomohon"],
            "Sulawesi Tengah": ["Palu"],
            "Sulawesi Selatan": ["Makassar", "Parepare", "Palopo"],
            "Sulawesi Tenggara": ["Kendari", "Baubau"],
            "Gorontalo": ["Gorontalo"],
            "Sulawesi Barat": ["Mamuju"],
            "Maluku": ["Ambon", "Tual"],
            "Maluku Utara": ["Ternate", "Tidore Kepulauan"],
            "Papua": ["Jayapura"],
            "Papua Barat": ["Sorong", "Manokwari"]
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [role, setRole] = React.useState('student');
            const [loading, setLoading] = React.useState(true);
            
            const [isRegister, setIsRegister] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [selectedRole, setSelectedRole] = React.useState('student');
            
            const [fullName, setFullName] = React.useState('');
            const [whatsapp, setWhatsapp] = React.useState('');
            const [gender, setGender] = React.useState('Ikhwan');
            const [province, setProvince] = React.useState('DKI Jakarta');
            const [city, setCity] = React.useState('Jakarta Pusat');
            const [birthYear, setBirthYear] = React.useState('1995');
            const [authError, setAuthError] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [allUsers, setAllUsers] = React.useState([]);
            const [kelasList, setKelasList] = React.useState([]);

            // State Form Tambah Kelas oleh Admin
            const [namaKelas, setNamaKelas] = React.useState('');
            const [jenisKelas, setJenisKelas] = React.useState('Reguler');
            const [deskripsiKelas, setDeskripsiKelas] = React.useState('');
            const [bukuPanduan, setBukuPanduan] = React.useState('');
            const [targetGender, setTargetGender] = React.useState('Ikhwan');
            const [rentangUsia, setRentangUsia] = React.useState('17 - 40 Tahun');
            const [jadwalKelas, setJadwalKelas] = React.useState('Sabtu / 16.00 WIB');
            const [frekuensiKelas, setFrekuensiKelas] = React.useState('2 kali sepekan');
            const [investasi, setInvestasi] = React.useState('Rp 150.000 / bulan');
            const [posterUrl, setPosterUrl] = React.useState('');
            const [thumbnailUrl, setThumbnailUrl] = React.useState('');
            const [qrisUrl, setQrisUrl] = React.useState('');

            React.useEffect(() => {
                supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
                    if (session) await handleUserSession(session.user);
                    setLoading(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                    if (session) await handleUserSession(session.user);
                    else {
                        setUser(null);
                        setRole('student');
                    }
                    setLoading(false);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleUserSession = async (authUser) => {
                setUser(authUser);
                
                if (authUser.email === "ayobelajartajwid@gmail.com") {
                    setRole('admin');
                    fetchAllData();
                } else {
                    const { data } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', authUser.id)
                        .single();
                    
                    if (data && data.role) {
                        setRole(data.role);
                    } else if (authUser.user_metadata && authUser.user_metadata.role) {
                        setRole(authUser.user_metadata.role);
                    } else {
                        setRole('student');
                    }
                    fetchAllData();
                }
            };

            const fetchAllData = async () => {
                const { data: usersData } = await supabaseClient.from('profiles').select('*');
                if (usersData) setAllUsers(usersData);

                const { data: classData } = await supabaseClient.from('kelas').select('*');
                if (classData) setKelasList(classData);
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setAuthError('');

                if (isRegister) {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role: selectedRole, full_name: fullName, whatsapp, gender, province, city, birth_year: birthYear }
                        }
                    });
                    if (error) {
                        setAuthError(error.message);
                    } else {
                        if (data.user) {
                            await supabaseClient.from('profiles').upsert({
                                id: data.user.id,
                                email,
                                role: selectedRole,
                                full_name: fullName,
                                whatsapp,
                                gender,
                                province,
                                city,
                                birth_year: birthYear
                            });
                        }
                        alert("Pendaftaran berhasil! Silakan masuk menggunakan akun Anda.");
                        setIsRegister(false);
                    }
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) setAuthError("Gagal masuk: " + error.message);
                }
            };

            const handleGoogleLogin = async () => {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
                if (error) alert("Gagal login Google: " + error.message);
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setRole('student');
            };

            const handleDeleteAccount = async () => {
                const confirmation = confirm("Apakah Anda yakin ingin menghapus akun ini secara permanen? Data Anda akan dihapus dari sistem.");
                if (!confirmation) return;

                try {
                    const { error: profileError } = await supabaseClient
                        .from('profiles')
                        .delete()
                        .eq('id', user.id);

                    if (profileError) {
                        alert("Gagal menghapus profil: " + profileError.message);
                        return;
                    }

                    await supabaseClient.auth.signOut();
                    setUser(null);
                    setRole('student');
                    alert("Akun Anda berhasil dihapus dari sistem.");
                } catch (err) {
                    alert("Terjadi kesalahan saat menghapus akun: " + err.message);
                }
            };

            // Admin: Tambah Kelas Baru
            const handleCreateClass = async (e) => {
                e.preventDefault();
                const { error } = await supabaseClient.from('kelas').insert([
                    {
                        nama_kelas: namaKelas,
                        jenis: jenisKelas,
                        deskripsi: deskripsiKelas,
                        buku_panduan: bukuPanduan,
                        target_gender: targetGender,
                        rentang_usia: rentangUsia,
                        jadwal: jadwalKelas,
                        frekuensi: frekuensiKelas,
                        investasi: investasi,
                        poster_url: posterUrl,
                        thumbnail_url: thumbnailUrl,
                        qris_url: qrisUrl
                    }
                ]);

                if (error) {
                    alert("Gagal membuat kelas: " + error.message);
                } else {
                    alert("Kelas baru berhasil dibuat!");
                    setNamaKelas('');
                    setDeskripsiKelas('');
                    setBukuPanduan('');
                    fetchAllData();
                }
            };

            // Peserta: Daftar ke Kelas
            const handleDaftarKelas = async (kelasId) => {
                const { error } = await supabaseClient.from('pendaftaran_kelas').insert([
                    { user_id: user.id, kelas_id: kelasId, status: 'Menunggu Konfirmasi' }
                ]);
                if (error) {
                    alert("Gagal mendaftar kelas: " + error.message);
                } else {
                    alert("Berhasil mendaftar ke kelas! Menunggu konfirmasi admin.");
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-emerald-600 font-semibold animate-pulse text-lg">
                            Memuat Sistem Layanan Tajwid...
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-emerald-900/5 py-10">
                        <div className="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">
                            <div className="mb-6 flex justify-center">
                                <img src="./AYO BELAJAR TAJWID.png" alt="Logo" className="w-20 h-20 object-cover rounded-2xl shadow-md border" />
                            </div>
                            
                            <h1 className="text-2xl font-extrabold text-emerald-900 text-center mb-1">
                                {isRegister ? 'Pendaftaran Akun Baru' : 'Masuk ke Aplikasi'}
                            </h1>
                            <p className="text-gray-500 text-center mb-6 text-sm">Pusat Layanan Admin, Guru, dan Peserta</p>

                            {authError && (
                                <div className="mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl border border-red-200">
                                    {authError}
                                </div>
                            )}

                            <button 
                                onClick={handleGoogleLogin}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-2xl py-3 px-4 text-gray-700 font-semibold hover:bg-gray-50 transition shadow-sm mb-4"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>
                                Lanjutkan dengan Google
                            </button>

                            <div className="flex items-center my-4">
                                <div className="flex-grow border-t border-gray-200"></div>
                                <span className="px-3 text-gray-400 text-xs uppercase">Atau Email & Password</span>
                                <div className="flex-grow border-t border-gray-200"></div>
                            </div>

                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                {isRegister && (
                                    <>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
                                                <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Nama lengkap..." />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Nomor WhatsApp</label>
                                                <input type="text" required value={whatsapp} onChange={e => setWhatsapp(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="08123456789" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Gender</label>
                                                <select value={gender} onChange={e => setGender(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    <option value="Ikhwan">Ikhwan (Laki-laki)</option>
                                                    <option value="Akhwat">Akhwat (Perempuan)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Provinsi</label>
                                                <select value={province} onChange={e => { setProvince(e.target.value); setCity(wilayahIndonesia[e.target.value][0]); }} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    {Object.keys(wilayahIndonesia).map(prov => (
                                                        <option key={prov} value={prov}>{prov}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Kota / Kabupaten</label>
                                                <select value={city} onChange={e => setCity(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    {(wilayahIndonesia[province] || []).map(c => (
                                                        <option key={c} value={c}>{c}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Tahun Kelahiran</label>
                                                <input type="number" required value={birthYear} onChange={e => setBirthYear(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="1995" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Pilih Peran (Role)</label>
                                                <select value={selectedRole} onChange={e => setSelectedRole(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    <option value="student">Peserta / Siswa</option>
                                                    <option value="teacher">Guru / Pengajar</option>
                                                </select>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border text-sm" placeholder="nama@email.com" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border text-sm" placeholder="••••••••" />
                                </div>

                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm">
                                    {isRegister ? 'Daftar Akun' : 'Masuk'}
                                </button>
                            </form>

                            <div className="mt-6 text-center text-sm text-gray-500">
                                {isRegister ? (
                                    <p>Sudah punya akun? <button onClick={() => setIsRegister(false)} className="text-emerald-600 font-semibold hover:underline">Masuk di sini</button></p>
                                ) : (
                                    <p>Belum punya akun? <button onClick={() => setIsRegister(true)} className="text-emerald-600 font-semibold hover:underline">Daftar sekarang</button></p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex bg-gray-100">
                    <aside className="w-64 bg-emerald-900 text-white flex flex-col shadow-xl">
                        <div className="p-5 border-b border-emerald-800 flex items-center gap-3">
                            <img src="./AYO BELAJAR TAJWID.png" className="w-10 h-10 rounded-xl bg-white p-1" alt="Logo" />
                            <div>
                                <h1 className="font-bold text-sm leading-tight">Ayo Belajar Tajwid</h1>
                                <span className="text-[10px] bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">
                                    {role}
                                </span>
                            </div>
                        </div>

                        <nav className="flex-1 p-4 space-y-1.5 text-sm font-medium">
                            {role === 'admin' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'dashboard' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">❖</span> Dashboard Admin
                                    </button>
                                    <button onClick={() => setActiveTab('users')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'users' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">👥</span> Data Pengguna Terdaftar
                                    </button>
                                    <button onClick={() => setActiveTab('classes')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'classes' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">📚</span> Manajemen Kelas & Guru
                                    </button>
                                    <button onClick={() => setActiveTab('finance')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'finance' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">💳</span> Keuangan & Gaji
                                    </button>
                                </>
                            )}

                            {role === 'teacher' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'dashboard' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">❖</span> Dashboard Guru
                                    </button>
                                    <button onClick={() => setActiveTab('students')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'students' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">📖</span> List Murid & Pembayaran
                                    </button>
                                    <button onClick={() => setActiveTab('reports')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'reports' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">📝</span> Catatan & Laporan Bulanan
                                    </button>
                                    <button onClick={() => setActiveTab('salary')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'salary' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">💰</span> Status Pencairan Gaji
                                    </button>
                                    <button onClick={() => setActiveTab('chat')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'chat' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">💬</span> Chat dengan Peserta
                                    </button>
                                    <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'settings' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">⚙️</span> Pengaturan Akun
                                    </button>
                                </>
                            )}

                            {role === 'student' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'dashboard' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">❖</span> Dashboard Peserta
                                    </button>
                                    <button onClick={() => setActiveTab('available_classes')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'available_classes' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">🔍</span> Kelas Tersedia
                                    </button>
                                    <button onClick={() => setActiveTab('enroll')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'enroll' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">📖</span> Pendaftaran & Kelas Saya
                                    </button>
                                    <button onClick={() => setActiveTab('payment')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'payment' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">💳</span> Status Pembayaran Bulanan
                                    </button>
                                    <button onClick={() => setActiveTab('chat')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'chat' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">💬</span> Chat Admin & Guru
                                    </button>
                                    <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'settings' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <span className="text-lg">⚙️</span> Pengaturan Akun
                                    </button>
                                </>
                            )}
                        </nav>

                        <div className="p-4 border-t border-emerald-800">
                            <button onClick={handleLogout} className="w-full bg-emerald-950 hover:bg-black text-white py-2.5 rounded-xl text-xs font-semibold transition shadow-sm">
                                Keluar (Logout)
                            </button>
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Header dengan Judul Tab Dinamis */}
                        <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 shadow-sm">
                            <h2 className="font-extrabold text-xl text-emerald-900 tracking-wide">
                                {activeTab === 'dashboard' && 'Dashboard Admin'}
                                {activeTab === 'users' && 'Data Pengguna Terdaftar'}
                                {activeTab === 'classes' && 'Manajemen Kelas & Guru'}
                                {activeTab === 'finance' && 'Keuangan & Gaji'}
                                {activeTab === 'students' && 'List Murid & Pembayaran'}
                                {activeTab === 'reports' && 'Catatan & Laporan Bulanan'}
                                {activeTab === 'salary' && 'Status Pencairan Gaji'}
                                {activeTab === 'available_classes' && 'Kelas Tersedia'}
                                {activeTab === 'enroll' && 'Pendaftaran & Kelas Saya'}
                                {activeTab === 'payment' && 'Status Pembayaran Bulanan'}
                                {activeTab === 'chat' && 'Pusat Chat & Komunikasi'}
                                {activeTab === 'settings' && 'Pengaturan Akun'}
                            </h2>
                            <div className="flex items-center gap-2 text-sm text-gray-600 bg-gray-50 px-3 py-1.5 rounded-xl border">
                                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                Login sebagai: <strong className="text-emerald-700">{user.email}</strong>
                            </div>
                        </header>

                        <main className="flex-1 p-8 overflow-y-auto">
                            {/* ================= ADMIN VIEW ================= */}
                            {role === 'admin' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-600 to-teal-800 text-white p-8 rounded-3xl shadow-lg flex items-center justify-between">
                                        <div>
                                            <h2 className="text-3xl font-extrabold mb-2">Panel Kendali Admin</h2>
                                            <p className="text-emerald-100 text-sm max-w-xl">Mengontrol seluruh aktivitas guru, peserta aktif, kelas pembelajaran, laporan, dan rekapitulasi keuangan secara real-time.</p>
                                        </div>
                                        <div className="hidden md:block text-6xl opacity-80">📖</div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl font-bold">👨‍🏫</div>
                                            <div>
                                                <div className="text-2xl font-extrabold text-gray-800">{allUsers.filter(u => u.role === 'teacher').length} Guru</div>
                                                <div className="text-gray-400 text-xs font-semibold uppercase">Total Guru Pengajar</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center text-2xl font-bold">👨‍🎓</div>
                                            <div>
                                                <div className="text-2xl font-extrabold text-gray-800">{allUsers.filter(u => u.role === 'student').length} Peserta Aktif</div>
                                                <div className="text-gray-400 text-xs font-semibold uppercase">Total Peserta Terdaftar</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-2xl bg-cyan-50 text-cyan-600 flex items-center justify-center text-2xl font-bold">🏫</div>
                                            <div>
                                                <div className="text-2xl font-extrabold text-gray-800">{kelasList.length} Kelas</div>
                                                <div className="text-gray-400 text-xs font-semibold uppercase">Kelas Aktif Berjalan</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {role === 'admin' && activeTab === 'users' && (
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                                    <h3 className="font-bold text-lg text-gray-800">Daftar Seluruh Pengguna Sistem</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm">
                                            <thead>
                                                <tr className="border-b bg-gray-50/70 text-gray-500 text-xs uppercase tracking-wider">
                                                    <th className="p-4">Nama Lengkap</th>
                                                    <th className="p-4">Email</th>
                                                    <th className="p-4">Peran (Role)</th>
                                                    <th className="p-4">WhatsApp</th>
                                                    <th className="p-4">Gender</th>
                                                    <th className="p-4">Domisili</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {allUsers.map((u, i) => (
                                                    <tr key={i} className="hover:bg-gray-50/50 transition">
                                                        <td className="p-4 font-bold text-gray-800">{u.full_name || '-'}</td>
                                                        <td className="p-4 text-gray-600">{u.email}</td>
                                                        <td className="p-4">
                                                            <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : u.role === 'teacher' ? 'bg-teal-100 text-teal-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                                {u.role}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-gray-600">{u.whatsapp || '-'}</td>
                                                        <td className="p-4 text-gray-600">{u.gender || '-'}</td>
                                                        <td className="p-4 text-gray-600">{u.city ? `${u.city}, ${u.province}` : '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {role === 'admin' && activeTab === 'classes' && (
                                <div className="space-y-8">
                                    {/* Form Buat Kelas Baru */}
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-6">
                                        <div>
                                            <h3 className="font-extrabold text-xl text-gray-800">Buat Kelas Pembelajaran Baru</h3>
                                            <p className="text-gray-500 text-sm">Formulir lengkap pembuatan kelas reguler atau privat untuk peserta.</p>
                                        </div>
                                        <form onSubmit={handleCreateClass} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Nama Kelas</label>
                                                <input type="text" required value={namaKelas} onChange={e => setNamaKelas(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm focus:ring-2 focus:ring-emerald-500" placeholder="Contoh: Tahsin Dasar Ikhwan" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Jenis Kelas</label>
                                                <select value={jenisKelas} onChange={e => setJenisKelas(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm bg-white">
                                                    <option value="Reguler">Reguler</option>
                                                    <option value="Privat">Privat</option>
                                                </select>
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Deskripsi Kelas</label>
                                                <textarea rows="2" required value={deskripsiKelas} onChange={e => setDeskripsiKelas(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="Deskripsi singkat mengenai kelas..."></textarea>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Buku Panduan</label>
                                                <input type="text" value={bukuPanduan} onChange={e => setBukuPanduan(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="Contoh: Kitab At-Tajwid" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Terbuka Untuk (Gender)</label>
                                                <select value={targetGender} onChange={e => setTargetGender(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm bg-white">
                                                    <option value="Ikhwan">Ikhwan (Laki-laki)</option>
                                                    <option value="Akhwat">Akhwat (Perempuan)</option>
                                                    <option value="Umum">Umum</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Rentang Usia</label>
                                                <input type="text" value={rentangUsia} onChange={e => setRentangUsia(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="17 - 40 Tahun" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Jadwal (Hari / Waktu)</label>
                                                <input type="text" value={jadwalKelas} onChange={e => setJadwalKelas(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="Sabtu / 16.00 WIB" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Frekuensi per Pekan</label>
                                                <input type="text" value={frekuensiKelas} onChange={e => setFrekuensiKelas(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="2 kali sepekan" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Investasi Belajar (Harga)</label>
                                                <input type="text" value={investasi} onChange={e => setInvestasi(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="Rp 150.000 / bulan" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">URL Poster / Gambar</label>
                                                <input type="text" value={posterUrl} onChange={e => setPosterUrl(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="https://..." />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">URL Thumbnail</label>
                                                <input type="text" value={thumbnailUrl} onChange={e => setThumbnailUrl(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="https://..." />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">URL QRIS Pembayaran</label>
                                                <input type="text" value={qrisUrl} onChange={e => setQrisUrl(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm" placeholder="https://..." />
                                            </div>
                                            <div className="md:col-span-2">
                                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm transition shadow-md">
                                                    Terbitkan Kelas Baru
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    {/* List Kelas yang Dibuat Admin */}
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                                        <h3 className="font-bold text-lg text-gray-800">Daftar Kelas Aktif di Sistem</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {kelasList.map((cls, idx) => (
                                                <div key={idx} className="border border-gray-200 rounded-2xl p-5 space-y-3 bg-gray-50/50">
                                                    <div className="flex justify-between items-start">
                                                        <h4 className="font-extrabold text-base text-gray-800">{cls.nama_kelas}</h4>
                                                        <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full uppercase">{cls.jenis}</span>
                                                    </div>
                                                    <p className="text-gray-600 text-xs">{cls.deskripsi}</p>
                                                    <div className="text-xs text-gray-500 space-y-1 pt-2 border-t border-gray-200">
                                                        <div>📅 <strong>Jadwal:</strong> {cls.jadwal} ({cls.frekuensi})</div>
                                                        <div>👥 <strong>Target:</strong> {cls.target_gender} ({cls.rentang_usia})</div>
                                                        <div>💰 <strong>Investasi:</strong> {cls.investasi}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ================= STUDENT VIEW ================= */}
                            {role === 'student' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-8 rounded-3xl shadow-lg">
                                        <h2 className="text-3xl font-extrabold mb-2">Dashboard Peserta (Siswa)</h2>
                                        <p className="text-emerald-100 text-sm max-w-xl">Selamat datang di pusat belajar tajwid interaktif. Pilih kelas terbaik Anda dan pantau perkembangan belajar bersama pengajar profesional.</p>
                                    </div>
                                </div>
                            )}

                            {role === 'student' && activeTab === 'available_classes' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                        <h3 className="font-extrabold text-xl text-gray-800 mb-1">Pilihan Kelas Tersedia</h3>
                                        <p className="text-gray-500 text-sm">Pilih dan daftarkan diri Anda ke kelas tajwid yang disediakan oleh admin.</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {kelasList.map((cls, idx) => (
                                            <div key={idx} className="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm space-y-4 flex flex-col justify-between">
                                                <div className="space-y-3">
                                                    <div className="flex justify-between items-start">
                                                        <h4 className="font-extrabold text-lg text-emerald-900">{cls.nama_kelas}</h4>
                                                        <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase">{cls.jenis}</span>
                                                    </div>
                                                    <p className="text-gray-600 text-sm">{cls.deskripsi}</p>
                                                    <div className="text-xs text-gray-500 space-y-1 pt-2 border-t">
                                                        <div>📖 <strong>Buku:</strong> {cls.buku_panduan || '-'}</div>
                                                        <div>📅 <strong>Jadwal:</strong> {cls.jadwal} ({cls.frekuensi})</div>
                                                        <div>👥 <strong>Target:</strong> {cls.target_gender}</div>
                                                        <div>💰 <strong>Investasi:</strong> {cls.investasi}</div>
                                                    </div>
                                                </div>
                                                <button onClick={() => handleDaftarKelas(cls.id)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm transition shadow-sm">
                                                    Daftar ke Kelas Ini
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Pengaturan Akun & Hapus Akun */}
                            {(role === 'teacher' || role === 'student') && activeTab === 'settings' && (
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 max-w-xl space-y-6">
                                    <div>
                                        <h3 className="font-extrabold text-xl text-gray-800 mb-1">Pengaturan Akun</h3>
                                        <p className="text-gray-500 text-sm">Kelola keamanan dan data pribadi akun Anda.</p>
                                    </div>

                                    <div className="border-t pt-4 space-y-4">
                                        <div className="bg-red-50 border border-red-200 rounded-2xl p-6 space-y-3">
                                            <h4 className="font-bold text-red-700 text-sm">Zona Bahaya (Hapus Akun)</h4>
                                            <p className="text-xs text-gray-600">
                                                Tindakan ini akan menghapus seluruh data profil dan akses akun Anda dari sistem secara permanen.
                                            </p>
                                            <button 
                                                onClick={handleDeleteAccount}
                                                className="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-sm"
                                            >
                                                Hapus Akun Saya
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Tab Default Lainnya */}
                            {activeTab !== 'dashboard' && activeTab !== 'users' && activeTab !== 'classes' && activeTab !== 'available_classes' && activeTab !== 'settings' && (
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-2">
                                    <h3 className="font-bold text-lg text-gray-800">Modul Layanan: {activeTab}</h3>
                                    <p className="text-gray-500 text-sm">Fitur operasional ini sedang berjalan secara sinkron di sistem.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
