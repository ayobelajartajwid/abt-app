                                            </div>
                                            <div className="flex gap-2 pt-2">
                                                <button type="button" onClick={() => setShowEmailModal(false)} className="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold text-xs">Batal</button>
                                                <button type="submit" className="flex-1 bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs">Kirim Email</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {/* Modal Tambah Materi Baru */}
                            {showAddMaterialModal && (
                                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <h3 className="font-extrabold text-base text-emerald-950">Tambah Modul / Video Baru</h3>
                                            <button onClick={() => setShowAddMaterialModal(false)} className="text-slate-400 font-bold">✕</button>
                                        </div>
                                        <form onSubmit={handleAddMaterial} className="space-y-3">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 uppercase">Judul Materi</label>
                                                <input type="text" required value={judulMateri} onChange={e => setJudulMateri(e.target.value)} className="w-full px-3.5 py-2 rounded-xl border text-xs" placeholder="Contoh: Hukum Nun Sukun" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 uppercase">Tipe Materi</label>
                                                <select value={tipeMateri} onChange={e => setTipeMateri(e.target.value)} className="w-full px-3.5 py-2 rounded-xl border text-xs bg-white">
                                                    <option value="PDF">Dokumen PDF</option>
                                                    <option value="Video">Video Embed YouTube</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 uppercase">Link File / URL Video Embed</label>
                                                <input type="text" required value={linkMateri} onChange={e => setLinkMateri(e.target.value)} className="w-full px-3.5 py-2 rounded-xl border text-xs" placeholder="https://..." />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 uppercase">Deskripsi Singkat</label>
                                                <textarea rows="3" required value={deskripsiMateri} onChange={e => setDeskripsiMateri(e.target.value)} className="w-full px-3.5 py-2 rounded-xl border text-xs" placeholder="Penjelasan ringkas..."></textarea>
                                            </div>
                                            <div className="flex gap-2 pt-2">
                                                <button type="button" onClick={() => setShowAddMaterialModal(false)} className="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold text-xs">Batal</button>
                                                <button type="submit" className="flex-1 bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs">Simpan Materi</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
