<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayo Belajar Tajwid - Pusat Layanan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = "https://qhiaawsvsilwynreerdm.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoaWFhd3N2c2lsd3lucmVlcmRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzgxMzksImV4cCI6MjEwODUxNDEzOX0.V56bbVi7usxoPXNpgUJQHETJ4j3FOz0dzuk5FMqPKbg";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [user, setUser] = React.useState(null);
            const [role, setRole] = React.useState('student');
            const [loading, setLoading] = React.useState(true);
            
            // State Form Login / Register
            const [isRegister, setIsRegister] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [selectedRole, setSelectedRole] = React.useState('student'); // 'teacher' atau 'student'
            const [authError, setAuthError] = React.useState('');

            React.useEffect(() => {
                supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
                    if (session) await handleUserSession(session.user);
                    setLoading(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                    if (session) await handleUserSession(session.user);
                    else {
                        setUser(null);
                        setRole('student');
                    }
                    setLoading(false);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleUserSession = async (authUser) => {
                setUser(authUser);
                
                // Khusus Admin Utama
                if (authUser.email === "ayobelajartajwid@gmail.com") {
                    setRole('admin');
                } else {
                    // Ambil role dari database tabel profiles, atau fallback ke stored metadata/default
                    const { data } = await supabaseClient
                        .from('profiles')
                        .select('role')
                        .eq('id', authUser.id)
                        .single();
                    
                    if (data && data.role) {
                        setRole(data.role);
                    } else if (authUser.user_metadata && authUser.user_metadata.role) {
                        setRole(authUser.user_metadata.role);
                    } else {
                        setRole('student');
                    }
                }
            };

            // Login Email & Password
            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setAuthError('');

                if (isRegister) {
                    // Proses Pendaftaran Manual dengan Role
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role: selectedRole }
                        }
                    });
                    if (error) {
                        setAuthError(error.message);
                    } else {
                        // Simpan juga ke tabel profiles jika ada
                        if (data.user) {
                            await supabaseClient.from('profiles').upsert({ id: data.user.id, email, role: selectedRole });
                        }
                        alert("Pendaftaran berhasil! Silakan cek email untuk verifikasi atau langsung login.");
                        setIsRegister(false);
                    }
                } else {
                    // Proses Login Manual
                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });
                    if (error) {
                        setAuthError("Gagal masuk: " + error.message);
                    }
                }
            };

            // Login Google OAuth
            const handleGoogleLogin = async () => {
                // Untuk Google, jika mendaftar baru, role default disimpan lewat metadata/tabel nanti
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin
                    }
                });
                if (error) alert("Gagal login Google: " + error.message);
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setRole('student');
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-emerald-600 font-semibold animate-pulse text-lg">
                            Memuat Sistem Layanan Tajwid...
                        </div>
                    </div>
                );
            }

            // 1. HALAMAN AUTHENTIKASI (LOGIN & REGISTER)
            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-emerald-900/5">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">
                            <div className="mb-6 flex justify-center">
                                <img src="./AYO BELAJAR TAJWID.png" alt="Logo" className="w-20 h-20 object-cover rounded-2xl shadow-md border" />
                            </div>
                            
                            <h1 className="text-2xl font-extrabold text-emerald-900 text-center mb-1">
                                {isRegister ? 'Pendaftaran Akun Baru' : 'Masuk ke Aplikasi'}
                            </h1>
                            <p className="text-gray-500 text-center mb-6 text-sm">Pusat Layanan Admin, Guru, dan Peserta</p>

                            {authError && (
                                <div className="mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl border border-red-200">
                                    {authError}
                                </div>
                            )}

                            {/* Tombol Google Login */}
                            <button 
                                onClick={handleGoogleLogin}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-2xl py-3 px-4 text-gray-700 font-semibold hover:bg-gray-50 transition shadow-sm mb-4"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>
                                Lanjutkan dengan Google
                            </button>

                            <div className="flex items-center my-4">
                                <div className="flex-grow border-t border-gray-200"></div>
                                <span className="px-3 text-gray-400 text-xs uppercase">Atau Email</span>
                                <div className="flex-grow border-t border-gray-200"></div>
                            </div>

                            {/* Form Manual Email & Password */}
                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                                    <input 
                                        type="email" 
                                        required 
                                        value={email} 
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                        placeholder="nama@email.com"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        required 
                                        value={password} 
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                        placeholder="••••••••"
                                    />
                                </div>

                                {isRegister && (
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Pilih Role / Peran</label>
                                        <select 
                                            value={selectedRole} 
                                            onChange={(e) => setSelectedRole(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white"
                                        >
                                            <option value="student">Peserta / Siswa</option>
                                            <option value="teacher">Guru / Pengajar</option>
                                        </select>
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm"
                                >
                                    {isRegister ? 'Daftar Akun' : 'Masuk'}
                                </button>
                            </form>

                            <div className="mt-6 text-center text-sm text-gray-500">
                                {isRegister ? (
                                    <p>Sudah punya akun? <button onClick={() => setIsRegister(false)} className="text-emerald-600 font-semibold hover:underline">Masuk di sini</button></p>
                                ) : (
                                    <p>Belum punya akun? <button onClick={() => setIsRegister(true)} className="text-emerald-600 font-semibold hover:underline">Daftar sekarang</button></p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. DASHBOARD UTAMA SESUAI ROLE
            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    <header className="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src="./AYO BELAJAR TAJWID.png" className="w-9 h-9 rounded-lg bg-white p-0.5" alt="Logo" />
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">Ayo Belajar Tajwid</h1>
                                    <span className="text-xs bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full font-medium uppercase">
                                        Role: {role}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-sm hidden sm:inline text-emerald-100">{user.email}</span>
                                <button onClick={handleLogout} className="bg-emerald-800 hover:bg-emerald-900 text-white text-xs px-3 py-2 rounded-xl font-medium transition">
                                    Keluar
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
                        {role === 'admin' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-3xl shadow-md">
                                    <h2 className="text-2xl font-bold mb-1">Panel Kendali Admin</h2>
                                    <p className="text-emerald-100 text-sm">Mengontrol seluruh aktivitas guru, peserta, kelas, laporan, dan keuangan.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">Kontrol Guru</div>
                                        <div className="text-gray-500 text-sm">Kelola & Gaji Pengajar</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">Kontrol Peserta</div>
                                        <div className="text-gray-500 text-sm">Status Pembayaran & Tagihan</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">Manajemen Kelas</div>
                                        <div className="text-gray-500 text-sm">Buka Kelas Reguler & Privat</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {role === 'teacher' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-6 rounded-3xl shadow-md">
                                    <h2 className="text-2xl font-bold mb-1">Dashboard Pengajar (Guru)</h2>
                                    <p className="text-teal-100 text-sm">Kelola murid, catatan pertemuan, laporan bulanan, dan status gaji.</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-lg text-gray-800 mb-3">Fitur Guru Aktif</h3>
                                    <p className="text-gray-500 text-sm">Silakan gunakan menu laporan pertemuan dan chat peserta di sini.</p>
                                </div>
                            </div>
                        )}

                        {role === 'student' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                    <h2 className="text-xl font-bold text-emerald-900 mb-1">Dashboard Peserta (Siswa)</h2>
                                    <p className="text-gray-500 text-sm">Pilih kelas tajwid, pantau status pembayaran, dan berinteraksi dengan guru.</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-lg text-gray-800 mb-3">Kelas Pilihan Anda</h3>
                                    <p className="text-gray-500 text-sm">Belum ada kelas yang diikuti. Hubungi admin untuk pendaftaran kelas.</p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
