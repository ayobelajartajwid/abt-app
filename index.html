        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [role, setRole] = React.useState('student');
            const [userProfile, setUserProfile] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            
            const [isRegister, setIsRegister] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [selectedRole, setSelectedRole] = React.useState('student');
            
            const [fullName, setFullName] = React.useState('');
            const [whatsapp, setWhatsapp] = React.useState('');
            const [gender, setGender] = React.useState('Ikhwan');
            const [province, setProvince] = React.useState('DKI Jakarta');
            const [city, setCity] = React.useState('Jakarta Pusat');
            const [birthYear, setBirthYear] = React.useState('1995');
            const [authError, setAuthError] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [allUsers, setAllUsers] = React.useState([]);
            const [kelasList, setKelasList] = React.useState([]);
            const [pendaftaranList, setPendaftaranList] = React.useState([]);

            // Modal Tambah Kelas
            const [showAddClassModal, setShowAddClassModal] = React.useState(false);
            const [namaKelas, setNamaKelas] = React.useState('');
            const [jenisKelas, setJenisKelas] = React.useState('Reguler');
            const [deskripsiKelas, setDeskripsiKelas] = React.useState('');
            const [bukuPanduan, setBukuPanduan] = React.useState('');
            const [targetGender, setTargetGender] = React.useState('Ikhwan');
            const [rentangUsia, setRentangUsia] = React.useState('17 - 40 Tahun');
            const [jadwalKelas, setJadwalKelas] = React.useState('Sabtu / 16.00 WIB');
            const [frekuensiKelas, setFrekuensiKelas] = React.useState('2 kali sepekan');
            const [investasi, setInvestasi] = React.useState('Rp 150.000 / bulan');
            
            const [posterFile, setPosterFile] = React.useState(null);
            const [thumbnailFile, setThumbnailFile] = React.useState(null);
            const [qrisFile, setQrisFile] = React.useState(null);
            const [uploading, setUploading] = React.useState(false);

            const [selectedClassForEnroll, setSelectedClassForEnroll] = React.useState(null);
            const [buktiBayarFile, setBuktiBayarFile] = React.useState(null);

            React.useEffect(() => {
                supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
                    if (session && session.user) await handleUserSession(session.user);
                    setLoading(false);
                }).catch(err => {
                    setLoading(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                    if (session && session.user) {
                        await handleUserSession(session.user);
                    } else {
                        setUser(null);
                        setRole('student');
                        setUserProfile(null);
                    }
                    setLoading(false);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleUserSession = async (authUser) => {
                setUser(authUser);
                try {
                    if (authUser.email === "ayobelajartajwid@gmail.com") {
                        setRole('admin');
                        setUserProfile({ full_name: 'Admin Utama', birth_year: '1990' });
                    } else {
                        const { data } = await supabaseClient
                            .from('profiles')
                            .select('*')
                            .eq('id', authUser.id)
                            .single();
                        
                        if (data) {
                            setUserProfile(data);
                            setRole(data.role || 'student');
                        } else if (authUser.user_metadata) {
                            setUserProfile(authUser.user_metadata);
                            setRole(authUser.user_metadata.role || 'student');
                        }
                    }
                    fetchAllData();
                } catch (err) {
                    console.error("Session error:", err);
                }
            };

            const fetchAllData = async () => {
                try {
                    const { data: usersData } = await supabaseClient.from('profiles').select('*');
                    if (usersData) setAllUsers(usersData);

                    const { data: classData } = await supabaseClient.from('kelas').select('*');
                    if (classData) setKelasList(classData);

                    const { data: pendaftaranData } = await supabaseClient.from('pendaftaran_kelas').select('*, kelas(*), profiles(*)');
                    if (pendaftaranData) setPendaftaranList(pendaftaranData);
                } catch (err) {
                    console.error("Fetch data error:", err);
                }
            };

            const uploadFileToStorage = async (file, folder = 'assets') => {
                if (!file) return '';
                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random().toString(36).substring(2)}.${fileExt}`;
                    const filePath = `${folder}/${fileName}`;

                    const { error: uploadError } = await supabaseClient.storage
                        .from('kelas-assets')
                        .upload(filePath, file);

                    if (uploadError) {
                        alert("Gagal upload file: " + uploadError.message + ". Pastikan bucket 'kelas-assets' sudah publik.");
                        return '';
                    }

                    const { data } = supabaseClient.storage.from('kelas-assets').getPublicUrl(filePath);
                    return data.publicUrl ? data.publicUrl : '';
                } catch (err) {
                    return '';
                }
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setAuthError('');

                try {
                    if (isRegister) {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: {
                                data: { role: selectedRole, full_name: fullName, whatsapp, gender, province, city, birth_year: birthYear }
                            }
                        });
                        if (error) throw error;

                        if (data.user) {
                            await supabaseClient.from('profiles').upsert({
                                id: data.user.id,
                                email,
                                role: selectedRole,
                                full_name: fullName,
                                whatsapp,
                                gender,
                                province,
                                city,
                                birth_year: birthYear
                            });
                        }
                        alert("Pendaftaran berhasil! Silakan masuk.");
                        setIsRegister(false);
                    } else {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                    }
                } catch (err) {
                    setAuthError("Autentikasi gagal: " + err.message);
                }
            };

            const handleGoogleLogin = async () => {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
                if (error) alert("Gagal login Google: " + error.message);
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setRole('student');
                setUserProfile(null);
            };

            const handleCreateClass = async (e) => {
                e.preventDefault();
                setUploading(true);

                try {
                    const posterUrl = await uploadFileToStorage(posterFile, 'poster');
                    const thumbnailUrl = await uploadFileToStorage(thumbnailFile, 'thumbnail');
                    const qrisUrl = await uploadFileToStorage(qrisFile, 'qris');

                    const { error } = await supabaseClient.from('kelas').insert([
                        {
                            nama_kelas: namaKelas,
                            jenis: jenisKelas,
                            deskripsi: deskripsiKelas,
                            buku_panduan: bukuPanduan,
                            target_gender: targetGender,
                            rentang_usia: rentangUsia,
                            jadwal: jadwalKelas,
                            frekuensi: frekuensiKelas,
                            investasi: investasi,
                            poster_url: posterUrl,
                            thumbnail_url: thumbnailUrl,
                            qris_url: qrisUrl
                        }
                    ]);

                    if (error) throw error;

                    alert("Kelas baru berhasil diterbitkan!");
                    setShowAddClassModal(false);
                    setNamaKelas('');
                    setDeskripsiKelas('');
                    setBukuPanduan('');
                    setPosterFile(null);
                    setThumbnailFile(null);
                    setQrisFile(null);
                    fetchAllData();
                } catch (err) {
                    alert("Gagal membuat kelas: " + err.message);
                } finally {
                    setUploading(false);
                }
            };

            const handleDeleteClass = async (kelasId) => {
                const confirmDelete = confirm("Apakah Anda yakin ingin menghapus kelas ini?");
                if (!confirmDelete) return;

                const { error } = await supabaseClient.from('kelas').delete().eq('id', kelasId);
                if (error) {
                    alert("Gagal menghapus kelas: " + error.message);
                } else {
                    alert("Kelas berhasil dihapus.");
                    fetchAllData();
                }
            };

            const handleKirimPendaftaran = async (e) => {
                e.preventDefault();
                if (!selectedClassForEnroll) return;
                setUploading(true);

                try {
                    const buktiUrl = await uploadFileToStorage(buktiBayarFile, 'bukti_bayar');

                    const { error } = await supabaseClient.from('pendaftaran_kelas').insert([
                        {
                            user_id: user.id,
                            kelas_id: selectedClassForEnroll.id,
                            status: 'Menunggu Konfirmasi',
                            bukti_bayar_url: buktiUrl
                        }
                    ]);

                    if (error) throw error;

                    alert("Pendaftaran dan bukti pembayaran berhasil dikirim!");
                    setSelectedClassForEnroll(null);
                    setBuktiBayarFile(null);
                    fetchAllData();
                } catch (err) {
                    alert("Gagal mendaftar: " + err.message);
                } finally {
                    setUploading(false);
                }
            };

            const handleStatusPendaftaran = async (pendaftaranId, statusBaru) => {
                let pesanAlasan = null;
                if (statusBaru === 'Ditolak') {
                    pesanAlasan = prompt("Masukkan alasan penolakan untuk peserta:");
                    if (pesanAlasan === null) return;
                }

                const updateData = { status: statusBaru };
                if (pesanAlasan) updateData.alasan_penolakan = pesanAlasan;

                const { error } = await supabaseClient
                    .from('pendaftaran_kelas')
                    .update(updateData)
                    .eq('id', pendaftaranId);

                if (error) {
                    alert("Gagal memperbarui status: " + error.message);
                } else {
                    alert(`Pendaftaran berhasil ${statusBaru === 'Disetujui' ? 'disetujui' : 'ditolak'}!`);
                    fetchAllData();
                }
            };

            const hitungUsia = (tahunLahir) => {
                if (!tahunLahir) return '-';
                const tahunAktif = new Date().getFullYear();
                const usia = tahunAktif - parseInt(tahunLahir);
                return isNaN(usia) ? '-' : `${usia} Tahun`;
            };

            if (loading) {

                                <div className="p-3 bg-emerald-50 rounded-2xl border border-emerald-100 shadow-inner mb-3">

                                </div>
                                <h1 className="text-2xl font-extrabold text-emerald-950 tracking-tight text-center">

                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>
                                Lanjutkan dengan Google
                            </button>

                            <div className="flex items-center my-5">
                                <div className="flex-grow border-t border-slate-200"></div>
                                <span className="px-3 text-slate-400 text-[10px] font-bold tracking-wider uppercase">Atau Email & Password</span>
                                <div className="flex-grow border-t border-slate-200"></div>
                            </div>

                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                {isRegister && (
                                    <>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Nama Lengkap</label>
                                                <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition" placeholder="Nama lengkap..." />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Nomor WhatsApp</label>
                                                <input type="text" required value={whatsapp} onChange={e => setWhatsapp(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition" placeholder="08123456789" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Gender</label>
                                                <select value={gender} onChange={e => setGender(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                                                    <option value="Ikhwan">Ikhwan (Laki-laki)</option>
                                                    <option value="Akhwat">Akhwat (Perempuan)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Provinsi</label>
                                                <select value={province} onChange={e => { setProvince(e.target.value); setCity(wilayahIndonesia[e.target.value][0]); }} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                                                    {Object.keys(wilayahIndonesia).map(prov => (
                                                        <option key={prov} value={prov}>{prov}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Kota / Kab</label>
                                                <select value={city} onChange={e => setCity(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                                                    {(wilayahIndonesia[province] || []).map(c => (
                                                        <option key={c} value={c}>{c}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Tahun Kelahiran</label>
                                                <input type="number" required value={birthYear} onChange={e => setBirthYear(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20" placeholder="1995" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1">Peran (Role)</label>
                                                <select value={selectedRole} onChange={e => setSelectedRole(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                                                    <option value="student">Peserta / Siswa</option>
                                                    <option value="teacher">Guru / Pengajar</option>
                                                </select>
                                            </div>
                                        </div>
                                    </>
                                )}

                                                    </div>
                                                    <div className="md:col-span-2 flex gap-3 pt-4 border-t">
                                                        <button type="button" onClick={() => setShowAddClassModal(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-2xl font-bold text-xs">Batal</button>
                                                        <button type="submit" disabled={uploading} className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-2xl font-bold text-xs">{uploading ? 'Menyimpan...' : 'Terbitkan Kelas Baru'}</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Dashboard Student */}
                            {role === 'student' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white p-8 rounded-3xl shadow-lg border border-emerald-700/30">
                                        <h2 className="text-2xl font-extrabold mb-1">Ahlan Wa Sahlan, {userProfile?.full_name || 'Peserta'} 👋</h2>
                                        <p className="text-emerald-100/80 text-xs">Selamat datang di pusat belajar Tajwid. Usia terdaftar: <strong className="text-white underline">{hitungUsia(userProfile?.birth_year)}</strong></p>
                                    </div>
                                </div>
                            )}

                            {/* Available Classes */}
                            {role === 'student' && activeTab === 'available_classes' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {kelasList.map((cls, idx) => (
                                        <div key={idx} className="bg-white border border-slate-200/60 rounded-3xl p-6 shadow-sm space-y-4 flex flex-col justify-between hover:shadow-md transition">
                                            <div className="space-y-3">
                                                {cls.thumbnail_url && <img src={cls.thumbnail_url} alt="Thumb" className="w-full aspect-[4/5] object-cover rounded-2xl border border-slate-100" />}
                                                <div className="flex justify-between items-start">
                                                    <h4 className="font-extrabold text-base text-emerald-950">{cls.nama_kelas}</h4>
                                                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">{cls.jenis}</span>
                                                </div>
                                                <p className="text-slate-600 text-xs leading-relaxed">{cls.deskripsi}</p>
                                                <div className="text-xs text-slate-500 space-y-1.5 pt-3 border-t border-slate-100">
                                                    <div>📅 <strong>Jadwal:</strong> {cls.jadwal}</div>
                                                    <div>💰 <strong>Investasi:</strong> <strong className="text-emerald-700">{cls.investasi}</strong></div>
                                                </div>
                                            </div>
                                            <button onClick={() => setSelectedClassForEnroll(cls)} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-2xl font-bold text-xs shadow-sm transition">
                                                Daftar & Bayar Sekarang
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* My Classes */}
                            {role === 'student' && activeTab === 'my_classes' && (
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/60 space-y-4">
                                    <h3 className="font-extrabold text-base text-slate-800">Status Pendaftaran & Kelas Saya</h3>
                                    <div className="space-y-3">
                                        {pendaftaranList.filter(p => p.user_id === user.id).map((p, idx) => (
                                            <div key={idx} className="border border-slate-200/70 rounded-2xl p-4 space-y-2 bg-slate-50/50">
                                                <div className="flex justify-between items-center">
                                                    <h4 className="font-bold text-sm text-slate-800">{p.kelas?.nama_kelas || 'Kelas Tajwid'}</h4>
                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase ${p.status === 'Disetujui' ? 'bg-emerald-100 text-emerald-800' : p.status === 'Ditolak' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'}`}>
                                                        {p.status}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-500">Jenis: {p.kelas?.jenis} | Jadwal: {p.kelas?.jadwal}</p>
                                                {p.status === 'Ditolak' && p.alasan_penolakan && (
                                                    <div className="p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200/60 mt-2">
                                                        <strong>Alasan Penolakan:</strong> {p.alasan_penolakan}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                        {pendaftaranList.filter(p => p.user_id === user.id).length === 0 && (
                                            <p className="text-slate-400 text-xs py-6 text-center font-medium">Anda belum mendaftar ke kelas manapun.</p>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Enroll Modal */}
                            {selectedClassForEnroll && (
                                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                                    <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-100">
                                        <h3 className="font-extrabold text-base text-emerald-950">Konfirmasi Pembayaran Kelas</h3>
                                        <p className="text-xs text-slate-500 leading-relaxed">Silakan scan kode QRIS di bawah ini lalu unggah foto bukti transfer Anda.</p>
                                        {selectedClassForEnroll.qris_url && <img src={selectedClassForEnroll.qris_url} alt="QRIS" className="w-48 h-48 mx-auto object-contain border border-slate-200 rounded-2xl p-2 bg-slate-50" />}
                                        <form onSubmit={handleKirimPendaftaran} className="space-y-3 pt-2">
                                            <div>
                                                <label className="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">Bukti Transfer</label>
                                                <input type="file" required accept="image/*" onChange={e => setBuktiBayarFile(e.target.files[0])} className="w-full p-2 border rounded-xl text-xs bg-white" />
                                            </div>
                                            <div className="flex gap-2 pt-2">
                                                <button type="button" onClick={() => setSelectedClassForEnroll(null)} className="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold text-xs text-slate-700">Batal</button>
                                                <button type="submit" disabled={uploading} className="flex-1 bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs">{uploading ? 'Mengirim...' : 'Kirim Bukti'}</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
