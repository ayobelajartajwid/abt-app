<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayo Belajar Tajwid - Pusat Layanan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // Konfigurasi Supabase Anda
        const SUPABASE_URL = "https://qhiaawsvsilwynreerdm.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoaWFhd3N2c2lsd3lucmVlcmRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzgxMzksImV4cCI6MjEwODUxNDEzOX0.V56bbVi7usxoPXNpgUJQHETJ4j3FOz0dzuk5FMqPKbg";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [user, setUser] = React.useState(null);
            const [role, setRole] = React.useState('student'); // 'admin', 'teacher', 'student'
            const [loading, setLoading] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState('dashboard');

            // Cek Sesi Login saat halaman dimuat
            React.useEffect(() => {
                supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
                    if (session) {
                        await handleUserSession(session.user);
                    } else {
                        setLoading(false);
                    }
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                    if (session) {
                        await handleUserSession(session.user);
                    } else {
                        setUser(null);
                        setLoading(false);
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            // Menentukan Role berdasarkan Email atau Database
            const handleUserSession = async (authUser) => {
                setUser(authUser);
                
                // Aturan Admin Utama
                if (authUser.email === "ayobelajartajwid@gmail.com") {
                    setRole('admin');
                } else {
                    // Cek role dari tabel database 'profiles' (jika sudah dibuat di Supabase)
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('role')
                        .eq('id', authUser.id)
                        .single();
                    
                    if (data && data.role) {
                        setRole(data.role); // 'teacher' atau 'student'
                    } else {
                        setRole('student'); // Default role untuk pendaftar baru
                    }
                }
                setLoading(false);
            };

            const handleGoogleLogin = async () => {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin
                    }
                });
                if (error) alert("Gagal login: " + error.message);
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setRole('student');
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-emerald-600 font-semibold animate-pulse text-lg">
                            Memuat Sistem Layanan Tajwid...
                        </div>
                    </div>
                );
            }

            // 1. HALAMAN LOGIN
            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-emerald-900/5">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 text-center border border-gray-100">
                            <div className="mb-6 flex justify-center">
                                <img src="./AYO BELAJAR TAJWID.png" alt="Logo" className="w-24 h-24 object-cover rounded-2xl shadow-md border" />
                            </div>
                            <h1 className="text-2xl font-extrabold text-emerald-900 mb-2">Ayo Belajar Tajwid</h1>
                            <p className="text-gray-500 mb-8 text-sm">Pusat Layanan Terpadu Admin, Guru, dan Peserta</p>
                            
                            <button 
                                onClick={handleGoogleLogin}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-2xl py-3.5 px-4 text-gray-700 font-semibold hover:bg-gray-50 transition shadow-sm"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>
                                Masuk / Daftar dengan Google
                            </button>
                        </div>
                    </div>
                );
            }

            // 2. DASHBOARD UTAMA BERDASARKAN ROLE
            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    {/* Header Navbar */}
                    <header className="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src="./AYO BELAJAR TAJWID.png" className="w-9 h-9 rounded-lg bg-white p-0.5" alt="Logo" />
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">Ayo Belajar Tajwid</h1>
                                    <span className="text-xs bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full font-medium uppercase">
                                        Role: {role}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-sm hidden sm:inline text-emerald-100">{user.email}</span>
                                <button onClick={handleLogout} className="bg-emerald-800 hover:bg-emerald-900 text-white text-xs px-3 py-2 rounded-xl font-medium transition">
                                    Keluar
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Konten Berdasarkan Role */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
                        
                        {/* ================= ADMIN DASHBOARD ================= */}
                        {role === 'admin' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-3xl shadow-md">
                                    <h2 className="text-2xl font-bold mb-1">Panel Kendali Admin</h2>
                                    <p className="text-emerald-100 text-sm">Mengontrol seluruh aktivitas guru, peserta, kelas, laporan, dan keuangan.</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">8 Guru</div>
                                        <div className="text-gray-500 text-sm">Guru Aktif</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">45 Peserta</div>
                                        <div className="text-gray-500 text-sm">Reguler & Privat</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">Rp 12.5 Juta</div>
                                        <div className="text-gray-500 text-sm">Tagihan & Pembayaran</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <div className="text-emerald-600 text-2xl font-bold mb-1">6 Kelas</div>
                                        <div className="text-gray-500 text-sm">Kelas Aktif Berjalan</div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-lg text-gray-800 mb-4">Fitur Administrasi Utama</h3>
                                    <div className="flex flex-wrap gap-3">
                                        <button className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition">Kelola & Gaji Guru</button>
                                        <button className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition">Status Pembayaran Peserta</button>
                                        <button className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition">Buka Kelas Baru</button>
                                        <button className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition">Kirim Notifikasi</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= TEACHER DASHBOARD ================= */}
                        {role === 'teacher' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-6 rounded-3xl shadow-md">
                                    <h2 className="text-2xl font-bold mb-1">Dashboard Pengajar (Guru)</h2>
                                    <p className="text-teal-100 text-sm">Kelola murid, buat catatan pertemuan, kirim laporan bulanan, dan pantau pencairan gaji.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <h3 className="font-bold text-lg text-gray-800 mb-3">Daftar Murid / Peserta</h3>
                                        <p className="text-gray-500 text-sm mb-4">Murid yang didaftarkan admin ke kelas Anda.</p>
                                        <div className="space-y-2">
                                            <div className="p-3 bg-gray-50 rounded-xl flex justify-between items-center text-sm">
                                                <span>Ahmad Fauzi (Reguler)</span>
                                                <span className="text-emerald-600 font-semibold">Lunas</span>
                                            </div>
                                            <div className="p-3 bg-gray-50 rounded-xl flex justify-between items-center text-sm">
                                                <span>Siti Aminah (Privat)</span>
                                                <span className="text-amber-600 font-semibold">Menunggu Tagihan</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                        <h3 className="font-bold text-lg text-gray-800 mb-3">Aksi & Laporan Guru</h3>
                                        <div className="space-y-3">
                                            <button className="w-full text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-3 rounded-xl text-sm font-semibold transition">
                                                📝 Buat Catatan Pertemuan Baru
                                            </button>
                                            <button className="w-full text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-3 rounded-xl text-sm font-semibold transition">
                                                📤 Kirim Laporan Bulanan ke Admin
                                            </button>
                                            <button className="w-full text-left bg-emerald-50 hover:bg-emerald-100 text-emerald-800 p-3 rounded-xl text-sm font-semibold transition">
                                                💬 Chat dengan Peserta
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= STUDENT DASHBOARD ================= */}
                        {role === 'student' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                    <h2 className="text-xl font-bold text-emerald-900 mb-1">Dashboard Peserta (Siswa)</h2>
                                    <p className="text-gray-500 text-sm">Pilih kelas tajwid, pantau status pembayaran, dan berinteraksi dengan guru.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <span className="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-bold">Kelas Saya</span>
                                        <h3 className="font-bold text-lg text-gray-800 mt-2 mb-1">Tajwid Dasar Reguler</h3>
                                        <p className="text-gray-500 text-xs mb-3">Pengajar: Ustadz Ahmad</p>
                                        <button className="w-full bg-emerald-600 text-white py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700">Masuk Kelas</button>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <span className="text-xs bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full font-bold">Status Pembayaran</span>
                                        <h3 className="font-bold text-lg text-gray-800 mt-2 mb-1">Bulan Oktober 2026</h3>
                                        <p className="text-emerald-600 text-xs mb-3 font-semibold">Status: Lunas</p>
                                        <button className="w-full bg-gray-100 text-gray-700 py-2 rounded-xl text-sm font-semibold hover:bg-gray-200">Lihat Invoice</button>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                        <span className="text-xs bg-teal-100 text-teal-700 px-2.5 py-1 rounded-full font-bold">Bantuan</span>
                                        <h3 className="font-bold text-lg text-gray-800 mt-2 mb-1">Pusat Pesan</h3>
                                        <p className="text-gray-500 text-xs mb-3">Chat dengan Admin atau Guru</p>
                                        <button className="w-full bg-teal-600 text-white py-2 rounded-xl text-sm font-semibold hover:bg-teal-700">Buka Chat</button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
