    <script type="text/babel">
        const SUPABASE_URL = "https://qhiaawsvsilwynreerdm.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoaWFhd3N2c2lsd3lucmVlcmRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzgxMzksImV4cCI6MjEwODUxNDEzOX0.V56bbVi7usxoPXNpgUJQHETJ4j3FOz0dzuk5FMqPKbg";

            "Sumatera Utara": ["Medan", "Binjai", "Pematangsiantar", "Tanjungbalai", "Tebing Tinggi", "Padang Sidempuan"],

            "Nusa Tenggara Barat": ["Mataram", "Bima"],
            "Nusa Tenggara Timur": ["Kupang", "Maumere"],

            "Kalimantan Tengah": ["Palangka Raya"],
            "Kalimantan Selatan": ["Banjarmasin", "Banjarbaru"],
            "Kalimantan Timur": ["Samarinda", "Balikpapan", "Bontang"],
            "Kalimantan Utara": ["Tarakan"],
            "Sulawesi Utara": ["Manado", "Bitung", "Tomohon"],
            "Sulawesi Tengah": ["Palu"],
            "Sulawesi Selatan": ["Makassar", "Parepare", "Palopo"],
            "Sulawesi Tenggara": ["Kendari", "Baubau"],
            "Gorontalo": ["Gorontalo"],
            "Sulawesi Barat": ["Mamuju"],
            "Maluku": ["Ambon", "Tual"],
            "Maluku Utara": ["Ternate", "Tidore Kepulauan"],
            "Papua": ["Jayapura"],
            "Papua Barat": ["Sorong", "Manokwari"]
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [role, setRole] = React.useState('student');
            const [userProfile, setUserProfile] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            
            const [isRegister, setIsRegister] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [selectedRole, setSelectedRole] = React.useState('student');
            
            const [fullName, setFullName] = React.useState('');
            const [whatsapp, setWhatsapp] = React.useState('');
            const [gender, setGender] = React.useState('Ikhwan');
            const [province, setProvince] = React.useState('DKI Jakarta');
            const [city, setCity] = React.useState('Jakarta Pusat');
            const [birthYear, setBirthYear] = React.useState('1995');
            const [authError, setAuthError] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [allUsers, setAllUsers] = React.useState([]);
            const [kelasList, setKelasList] = React.useState([]);
            const [pendaftaranList, setPendaftaranList] = React.useState([]);

            // State Form Tambah Kelas oleh Admin
            const [namaKelas, setNamaKelas] = React.useState('');
            const [jenisKelas, setJenisKelas] = React.useState('Reguler');
            const [deskripsiKelas, setDeskripsiKelas] = React.useState('');
            const [bukuPanduan, setBukuPanduan] = React.useState('');
            const [targetGender, setTargetGender] = React.useState('Ikhwan');
            const [rentangUsia, setRentangUsia] = React.useState('17 - 40 Tahun');
            const [jadwalKelas, setJadwalKelas] = React.useState('Sabtu / 16.00 WIB');
            const [frekuensiKelas, setFrekuensiKelas] = React.useState('2 kali sepekan');
            const [investasi, setInvestasi] = React.useState('Rp 150.000 / bulan');
            
            // File Upload States
            const [posterFile, setPosterFile] = React.useState(null);
            const [thumbnailFile, setThumbnailFile] = React.useState(null);
            const [qrisFile, setQrisFile] = React.useState(null);
            const [uploading, setUploading] = React.useState(false);

            // Modal Pembayaran Peserta
            const [selectedClassForEnroll, setSelectedClassForEnroll] = React.useState(null);
            const [buktiBayarFile, setBuktiBayarFile] = React.useState(null);

            React.useEffect(() => {
                supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
                    if (session) await handleUserSession(session.user);
                    setLoading(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                    if (session) await handleUserSession(session.user);
                    else {
                        setUser(null);
                        setRole('student');
                        setUserProfile(null);
                    }
                    setLoading(false);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleUserSession = async (authUser) => {
                setUser(authUser);
                
                if (authUser.email === "ayobelajartajwid@gmail.com") {
                    setRole('admin');
                    setUserProfile({ full_name: 'Admin Utama', birth_year: '1990' });
                } else {
                    const { data } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', authUser.id)
                        .single();
                    
                    if (data) {
                        setUserProfile(data);
                        setRole(data.role || 'student');
                    } else if (authUser.user_metadata) {
                        setUserProfile(authUser.user_metadata);
                        setRole(authUser.user_metadata.role || 'student');
                    }
                }
                fetchAllData();
            };

            const fetchAllData = async () => {
                const { data: usersData } = await supabaseClient.from('profiles').select('*');
                if (usersData) setAllUsers(usersData);

                const { data: classData } = await supabaseClient.from('kelas').select('*');
                if (classData) setKelasList(classData);

                const { data: pendaftaranData } = await supabaseClient.from('pendaftaran_kelas').select('*, kelas(*), profiles(*)');
                if (pendaftaranData) setPendaftaranList(pendaftaranData);
            };

            // Fungsi Universal Upload ke Supabase Storage
            const uploadFileToStorage = async (file, folder = 'assets') => {
                if (!file) return '';
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random().toString(36.substring(2))}.${fileExt}`;
                const filePath = `${folder}/${fileName}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('kelas-assets') // Pastikan bucket bernama 'kelas-assets' di public
                    .upload(filePath, file);

                if (uploadError) {
                    // Fallback jika bucket belum ada, gunakan URL dummy atau alert
                    alert("Gagal upload file: " + uploadError.message + ". Pastikan bucket 'kelas-assets' sudah dibuat publik di Supabase.");
                    return '';
                }

                const { data } = supabaseClient.storage.from('kelas-assets').getPublicUrl(filePath);
                return data.publicUrl;
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setAuthError('');

                if (isRegister) {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role: selectedRole, full_name: fullName, whatsapp, gender, province, city, birth_year: birthYear }
                        }
                    });
                    if (error) {
                        setAuthError(error.message);
                    } else {
                        if (data.user) {
                            await supabaseClient.from('profiles').upsert({
                                id: data.user.id,
                                email,
                                role: selectedRole,
                                full_name: fullName,
                                whatsapp,
                                gender,
                                province,
                                city,
                                birth_year: birthYear
                            });
                        }
                        alert("Pendaftaran berhasil! Silakan masuk menggunakan akun Anda.");
                        setIsRegister(false);
                    }
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) setAuthError("Gagal masuk: " + error.message);
                }
            };

            const handleGoogleLogin = async () => {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
                if (error) alert("Gagal login Google: " + error.message);
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setRole('student');
                setUserProfile(null);
            };

            const handleDeleteAccount = async () => {
                const confirmation = confirm("Apakah Anda yakin ingin menghapus akun ini secara permanen?");
                if (!confirmation) return;

                try {
                    await supabaseClient.from('profiles').delete().eq('id', user.id);
                    await supabaseClient.auth.signOut();
                    setUser(null);
                    setRole('student');
                    alert("Akun Anda berhasil dihapus dari sistem.");
                } catch (err) {
                    alert("Terjadi kesalahan: " + err.message);
                }
            };

            // Admin: Terbitkan Kelas Baru dengan Direct Upload
            const handleCreateClass = async (e) => {
                e.preventDefault();
                setUploading(true);

                try {
                    const posterUrl = await uploadFileToStorage(posterFile, 'poster');
                    const thumbnailUrl = await uploadFileToStorage(thumbnailFile, 'thumbnail');
                    const qrisUrl = await uploadFileToStorage(qrisFile, 'qris');

                    const { error } = await supabaseClient.from('kelas').insert([
                        {
                            nama_kelas: namaKelas,
                            jenis: jenisKelas,
                            deskripsi: deskripsiKelas,
                            buku_panduan: bukuPanduan,
                            target_gender: targetGender,
                            rentang_usia: rentangUsia,
                            jadwal: jadwalKelas,
                            frekuensi: frekuensiKelas,
                            investasi: investasi,
                            poster_url: posterUrl || '',
                            thumbnail_url: thumbnailUrl || '',
                            qris_url: qrisUrl || ''
                        }
                    ]);

                    if (error) throw error;

                    alert("Kelas baru berhasil diterbitkan!");
                    setNamaKelas('');
                    setDeskripsiKelas('');
                    setBukuPanduan('');
                    setPosterFile(null);
                    setThumbnailFile(null);
                    setQrisFile(null);
                    fetchAllData();
                } catch (err) {
                    alert("Gagal membuat kelas: " + err.message);
                } finally {
                    setUploading(false);
                }
            };

            // Peserta: Kirim Pendaftaran & Bukti Bayar
            const handleKirimPendaftaran = async (e) => {
                e.preventDefault();
                if (!selectedClassForEnroll) return;
                setUploading(true);

                try {
                    const buktiUrl = await uploadFileToStorage(buktiBayarFile, 'bukti_bayar');

                    const { error } = await supabaseClient.from('pendaftaran_kelas').insert([
                        {
                            user_id: user.id,
                            kelas_id: selectedClassForEnroll.id,
                            status: 'Menunggu Konfirmasi',
                            bukti_bayar_url: buktiUrl || ''
                        }
                    ]);

                    if (error) throw error;

                    alert("Pendaftaran dan bukti pembayaran berhasil dikirim! Menunggu konfirmasi admin.");
                    setSelectedClassForEnroll(null);
                    setBuktiBayarFile(null);
                    fetchAllData();
                } catch (err) {
                    alert("Gagal mendaftar: " + err.message);
                } finally {
                    setUploading(false);
                }
            };

            // Admin: Konfirmasi Pendaftaran Peserta
            const handleStatusPendaftaran = async (pendaftaranId, statusBaru) => {
                const { error } = await supabaseClient
                    .from('pendaftaran_kelas')
                    .update({ status: statusBaru })
                    .eq('id', pendaftaranId);

                if (error) {
                    alert("Gagal memperbarui status: " + error.message);
                } else {
                    alert(`Pendaftaran berhasil ${statusBaru === 'Disetujui' ? 'disetujui' : 'ditolak'}!`);
                    fetchAllData();
                }
            };

            const hitungUsia = (tahunLahir) => {
                if (!tahunLahir) return '-';
                const tahunAktif = new Date().getFullYear();
                const usia = tahunAktif - parseInt(tahunLahir);
                return isNaN(usia) ? '-' : `${usia} Tahun`;
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-emerald-600 font-semibold animate-pulse text-lg">
                            Memuat Sistem Layanan Tajwid...
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (

                            <h1 className="text-2xl font-extrabold text-emerald-900 text-center mb-1">

                                onClick={handleGoogleLogin}

                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>
                                Lanjutkan dengan Google
                            </button>

                            <div className="flex items-center my-4">
                                <div className="flex-grow border-t border-gray-200"></div>
                                <span className="px-3 text-gray-400 text-xs uppercase">Atau Email & Password</span>
                                <div className="flex-grow border-t border-gray-200"></div>
                            </div>

                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                {isRegister && (
                                    <>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
                                                <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Nama lengkap..." />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Nomor WhatsApp</label>
                                                <input type="text" required value={whatsapp} onChange={e => setWhatsapp(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="08123456789" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Gender</label>
                                                <select value={gender} onChange={e => setGender(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    <option value="Ikhwan">Ikhwan (Laki-laki)</option>
                                                    <option value="Akhwat">Akhwat (Perempuan)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Provinsi</label>
                                                <select value={province} onChange={e => { setProvince(e.target.value); setCity(wilayahIndonesia[e.target.value][0]); }} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    {Object.keys(wilayahIndonesia).map(prov => (
                                                        <option key={prov} value={prov}>{prov}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Kota / Kabupaten</label>
                                                <select value={city} onChange={e => setCity(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    {(wilayahIndonesia[province] || []).map(c => (
                                                        <option key={c} value={c}>{c}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Tahun Kelahiran</label>
                                                <input type="number" required value={birthYear} onChange={e => setBirthYear(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="1995" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Pilih Peran (Role)</label>
                                                <select value={selectedRole} onChange={e => setSelectedRole(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    <option value="student">Peserta / Siswa</option>
                                                    <option value="teacher">Guru / Pengajar</option>
                                                </select>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border text-sm" placeholder="nama@email.com" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border text-sm" placeholder="••••••••" />
                                </div>

                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm">
                                    {isRegister ? 'Daftar Akun' : 'Masuk'}
                                </button>
                            </form>

                            <div className="mt-6 text-center text-sm text-gray-500">
                                {isRegister ? (
                                    <p>Sudah punya akun? <button onClick={() => setIsRegister(false)} className="text-emerald-600 font-semibold hover:underline">Masuk di sini</button></p>
                                ) : (
                                    <p>Belum punya akun? <button onClick={() => setIsRegister(true)} className="text-emerald-600 font-semibold hover:underline">Daftar sekarang</button></p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex bg-gray-100">
                    <aside className="w-64 bg-emerald-900 text-white flex flex-col shadow-xl">
                        <div className="p-5 border-b border-emerald-800 flex items-center gap-3">
                            <img src="./AYO BELAJAR TAJWID.png" className="w-10 h-10 rounded-xl bg-white p-1" alt="Logo" />
                            <div>
                                <h1 className="font-bold text-sm leading-tight">Ayo Belajar Tajwid</h1>
                                <span className="text-[10px] bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">
                                    {role}
                                </span>
                            </div>
                        </div>

                        <nav className="flex-1 p-4 space-y-1.5 text-sm font-medium">
                            {role === 'admin' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl transition flex items-center gap-3 ${activeTab === 'dashboard' ? 'bg-emerald-700 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                                        <svg className="w-5 h-5 opacity-80" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>

                                                        <div>💰 <strong>Investasi:</strong> {cls.investasi}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ================= STUDENT VIEW ================= */}
                            {role === 'student' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-8 rounded-3xl shadow-lg space-y-2">
                                        <h2 className="text-3xl font-extrabold">Selamat Datang, Ahlan Wa Sahlan {userProfile?.full_name || 'Peserta'}</h2>
                                        <p className="text-emerald-100 text-sm">Pusat belajar tajwid interaktif. Usia Anda saat ini: <strong className="text-white underline">{hitungUsia(userProfile?.birth_year)}</strong></p>
                                    </div>
                                </div>
                            )}

                            {role === 'student' && activeTab === 'available_classes' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                        <h3 className="font-extrabold text-xl text-gray-800 mb-1">Pilihan Kelas Tersedia</h3>
                                        <p className="text-gray-500 text-sm">Pilih kelas dan lakukan konfirmasi pembayaran melalui QRIS yang disediakan.</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {kelasList.map((cls, idx) => (
                                            <div key={idx} className="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm space-y-4 flex flex-col justify-between">
                                                <div className="space-y-3">
                                                    {cls.thumbnail_url && (
                                                        <img src={cls.thumbnail_url} alt="Poster" className="w-full h-48 object-cover rounded-2xl border" />
                                                    )}
                                                    <div className="flex justify-between items-start">
                                                        <h4 className="font-extrabold text-lg text-emerald-900">{cls.nama_kelas}</h4>
                                                        <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase">{cls.jenis}</span>
                                                    </div>
                                                    <p className="text-gray-600 text-sm">{cls.deskripsi}</p>
                                                    <div className="text-xs text-gray-500 space-y-1 pt-2 border-t">
                                                        <div>📖 <strong>Buku:</strong> {cls.buku_panduan || '-'}</div>
                                                        <div>📅 <strong>Jadwal:</strong> {cls.jadwal} ({cls.frekuensi})</div>
                                                        <div>💰 <strong>Investasi:</strong> <strong className="text-emerald-700">{cls.investasi}</strong></div>
                                                    </div>
                                                </div>
                                                <button onClick={() => setSelectedClassForEnroll(cls)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm transition shadow-sm">
                                                    Daftar & Konfirmasi Pembayaran
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Modal Konfirmasi Pembayaran Peserta */}
                            {selectedClassForEnroll && (
                                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                                    <div className="bg-white rounded-3xl max-w-lg w-full p-8 space-y-6 shadow-2xl">
                                        <h3 className="font-extrabold text-xl text-emerald-900">Konfirmasi Pendaftaran & Pembayaran</h3>
                                        <div className="space-y-2 text-sm text-gray-600">
                                            <p>Anda akan mendaftar ke kelas: <strong className="text-gray-800">{selectedClassForEnroll.nama_kelas}</strong></p>
                                            <p>Total Investasi: <strong className="text-emerald-700">{selectedClassForEnroll.investasi}</strong></p>
                                        </div>
                                        
                                        {selectedClassForEnroll.qris_url ? (
                                            <div className="text-center space-y-2">
                                                <p className="text-xs font-bold text-gray-500 uppercase">Scan QRIS Pembayaran di Bawah Ini:</p>
                                                <img src={selectedClassForEnroll.qris_url} alt="QRIS" className="w-48 h-48 mx-auto object-contain border rounded-xl" />
                                            </div>
                                        ) : (
                                            <div className="p-3 bg-amber-50 text-amber-700 text-xs rounded-xl">Silakan transfer sesuai nominal investasi ke rekening resmi lembaga.</div>
                                        )}

                                        <form onSubmit={handleKirimPendaftaran} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-600 mb-1 uppercase">Upload Bukti Transfer / Pembayaran</label>
                                                <input type="file" required accept="image/*" onChange={e => setBuktiBayarFile(e.target.files[0])} className="w-full px-3 py-2 rounded-xl border text-sm bg-white" />
                                            </div>
                                            <div className="flex gap-3">
                                                <button type="button" onClick={() => setSelectedClassForEnroll(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-xl font-bold text-sm">Batal</button>
                                                <button type="submit" disabled={uploading} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm">{uploading ? 'Mengirim...' : 'Kirim Bukti Bayar'}</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {(role === 'teacher' || role === 'student') && activeTab === 'settings' && (
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 max-w-xl space-y-6">
                                    <div>
                                        <h3 className="font-extrabold text-xl text-gray-800 mb-1">Pengaturan Akun</h3>
                                        <p className="text-gray-500 text-sm">Kelola keamanan dan data pribadi akun Anda.</p>
                                    </div>

                                    <div className="border-t pt-4 space-y-4">
                                        <div className="bg-red-50 border border-red-200 rounded-2xl p-6 space-y-3">
                                            <h4 className="font-bold text-red-700 text-sm">Zona Bahaya (Hapus Akun)</h4>
                                            <p className="text-xs text-gray-600">Tindakan ini akan menghapus seluruh data profil dan akses akun Anda dari sistem.</p>
                                            <button onClick={handleDeleteAccount} className="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-sm">
                                                Hapus Akun Saya
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab !== 'dashboard' && activeTab !== 'users' && activeTab !== 'classes' && activeTab !== 'available_classes' && activeTab !== 'settings' && (
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-2">
                                    <h3 className="font-bold text-lg text-gray-800">Modul Layanan: {activeTab}</h3>
                                    <p className="text-gray-500 text-sm">Fitur operasional ini sedang berjalan secara sinkron di sistem.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(root).render(<App />);
    </script>
</body>
</html>
