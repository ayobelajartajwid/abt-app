<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayo Belajar Tajwid - Pusat Layanan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = "https://qhiaawsvsilwynreerdm.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoaWFhd3N2c2lsd3lucmVlcmRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzgxMzksImV4cCI6MjEwODUxNDEzOX0.V56bbVi7usxoPXNpgUJQHETJ4j3FOz0dzuk5FMqPKbg";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const wilayahIndonesia = {
            "DKI Jakarta": ["Jakarta Pusat", "Jakarta Selatan", "Jakarta Timur", "Jakarta Barat", "Jakarta Utara"],
            "Jawa Barat": ["Bandung", "Bekasi", "Bogor", "Depok", "Cimahi", "Sukabumi", "Tasikmalaya"],
            "Jawa Tengah": ["Semarang", "Surakarta", "Solo", "Magelang", "Pekalongan", "Salatiga", "Tegal"],
            "Jawa Timur": ["Surabaya", "Malang", "Sidoarjo", "Jember", "Kediri", "Madiun", "Blitar"],
            "DI Yogyakarta": ["Yogyakarta", "Sleman", "Bantul", "Kulon Progo", "Gunungkidul"],
            "Banten": ["Tangerang", "Serang", "Cilegon", "Tangerang Selatan"]
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [role, setRole] = React.useState('student');
            const [loading, setLoading] = React.useState(true);
            
            const [isRegister, setIsRegister] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [selectedRole, setSelectedRole] = React.useState('student');
            
            const [fullName, setFullName] = React.useState('');
            const [whatsapp, setWhatsapp] = React.useState('');
            const [gender, setGender] = React.useState('Ikhwan');
            const [province, setProvince] = React.useState('DKI Jakarta');
            const [city, setCity] = React.useState('Jakarta Pusat');
            const [birthYear, setBirthYear] = React.useState('1995');
            const [authError, setAuthError] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [allUsers, setAllUsers] = React.useState([]);

            React.useEffect(() => {
                supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
                    if (session) await handleUserSession(session.user);
                    setLoading(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                    if (session) await handleUserSession(session.user);
                    else {
                        setUser(null);
                        setRole('student');
                    }
                    setLoading(false);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleUserSession = async (authUser) => {
                setUser(authUser);
                
                if (authUser.email === "ayobelajartajwid@gmail.com") {
                    setRole('admin');
                    fetchAllUsers();
                } else {
                    const { data } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', authUser.id)
                        .single();
                    
                    if (data && data.role) {
                        setRole(data.role);
                    } else if (authUser.user_metadata && authUser.user_metadata.role) {
                        setRole(authUser.user_metadata.role);
                    } else {
                        setRole('student');
                    }
                }
            };

            const fetchAllUsers = async () => {
                const { data } = await supabaseClient.from('profiles').select('*');
                if (data) setAllUsers(data);
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setAuthError('');

                if (isRegister) {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { role: selectedRole, full_name: fullName, whatsapp, gender, province, city, birth_year: birthYear }
                        }
                    });
                    if (error) {
                        setAuthError(error.message);
                    } else {
                        if (data.user) {
                            await supabaseClient.from('profiles').upsert({
                                id: data.user.id,
                                email,
                                role: selectedRole,
                                full_name: fullName,
                                whatsapp,
                                gender,
                                province,
                                city,
                                birth_year: birthYear
                            });
                        }
                        alert("Pendaftaran berhasil! Silakan masuk menggunakan akun Anda.");
                        setIsRegister(false);
                    }
                } else {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) setAuthError("Gagal masuk: " + error.message);
                }
            };

            const handleGoogleLogin = async () => {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
                if (error) alert("Gagal login Google: " + error.message);
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setRole('student');
            };

            // Fitur Hapus Akun Mandiri untuk Guru & Peserta
            const handleDeleteAccount = async () => {
                const confirmation = confirm("Apakah Anda yakin ingin menghapus akun ini secara permanen? Data Anda akan dihapus dari sistem.");
                if (!confirmation) return;

                try {
                    // Hapus data profil dari tabel database profiles
                    const { error: profileError } = await supabaseClient
                        .from('profiles')
                        .delete()
                        .eq('id', user.id);

                    if (profileError) {
                        alert("Gagal menghapus profil: " + profileError.message);
                        return;
                    }

                    // Logout pengguna setelah data profil terhapus
                    await supabaseClient.auth.signOut();
                    setUser(null);
                    setRole('student');
                    alert("Akun Anda berhasil dihapus dari sistem.");
                } catch (err) {
                    alert("Terjadi kesalahan saat menghapus akun: " + err.message);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-emerald-600 font-semibold animate-pulse text-lg">
                            Memuat Sistem Layanan Tajwid...
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-emerald-900/5 py-10">
                        <div className="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">
                            <div className="mb-6 flex justify-center">
                                <img src="./AYO BELAJAR TAJWID.png" alt="Logo" className="w-20 h-20 object-cover rounded-2xl shadow-md border" />
                            </div>
                            
                            <h1 className="text-2xl font-extrabold text-emerald-900 text-center mb-1">
                                {isRegister ? 'Pendaftaran Akun Baru' : 'Masuk ke Aplikasi'}
                            </h1>
                            <p className="text-gray-500 text-center mb-6 text-sm">Pusat Layanan Admin, Guru, dan Peserta</p>

                            {authError && (
                                <div className="mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl border border-red-200">
                                    {authError}
                                </div>
                            )}

                            <button 
                                onClick={handleGoogleLogin}
                                className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-2xl py-3 px-4 text-gray-700 font-semibold hover:bg-gray-50 transition shadow-sm mb-4"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>
                                Lanjutkan dengan Google
                            </button>

                            <div className="flex items-center my-4">
                                <div className="flex-grow border-t border-gray-200"></div>
                                <span className="px-3 text-gray-400 text-xs uppercase">Atau Email & Password</span>
                                <div className="flex-grow border-t border-gray-200"></div>
                            </div>

                            <form onSubmit={handleEmailAuth} className="space-y-4">
                                {isRegister && (
                                    <>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
                                                <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Nama lengkap..." />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Nomor WhatsApp</label>
                                                <input type="text" required value={whatsapp} onChange={e => setWhatsapp(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="08123456789" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Gender</label>
                                                <select value={gender} onChange={e => setGender(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    <option value="Ikhwan">Ikhwan (Laki-laki)</option>
                                                    <option value="Akhwat">Akhwat (Perempuan)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Provinsi</label>
                                                <select value={province} onChange={e => { setProvince(e.target.value); setCity(wilayahIndonesia[e.target.value][0]); }} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    {Object.keys(wilayahIndonesia).map(prov => (
                                                        <option key={prov} value={prov}>{prov}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Kota / Kabupaten</label>
                                                <select value={city} onChange={e => setCity(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    {(wilayahIndonesia[province] || []).map(c => (
                                                        <option key={c} value={c}>{c}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Tahun Kelahiran</label>
                                                <input type="number" required value={birthYear} onChange={e => setBirthYear(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm" placeholder="1995" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">Pilih Peran (Role)</label>
                                                <select value={selectedRole} onChange={e => setSelectedRole(e.target.value)} className="w-full px-3 py-2 rounded-xl border text-sm bg-white">
                                                    <option value="student">Peserta / Siswa</option>
                                                    <option value="teacher">Guru / Pengajar</option>
                                                </select>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border text-sm" placeholder="nama@email.com" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border text-sm" placeholder="••••••••" />
                                </div>

                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm">
                                    {isRegister ? 'Daftar Akun' : 'Masuk'}
                                </button>
                            </form>

                            <div className="mt-6 text-center text-sm text-gray-500">
                                {isRegister ? (
                                    <p>Sudah punya akun? <button onClick={() => setIsRegister(false)} className="text-emerald-600 font-semibold hover:underline">Masuk di sini</button></p>
                                ) : (
                                    <p>Belum punya akun? <button onClick={() => setIsRegister(true)} className="text-emerald-600 font-semibold hover:underline">Daftar sekarang</button></p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex bg-gray-100">
                    <aside className="w-64 bg-emerald-800 text-white flex flex-col shadow-xl">
                        <div className="p-5 border-b border-emerald-700 flex items-center gap-3">
                            <img src="./AYO BELAJAR TAJWID.png" className="w-10 h-10 rounded-xl bg-white p-1" alt="Logo" />
                            <div>
                                <h1 className="font-bold text-sm leading-tight">Ayo Belajar Tajwid</h1>
                                <span className="text-xs bg-emerald-900 text-emerald-200 px-2 py-0.5 rounded-full font-medium uppercase">
                                    {role}
                                </span>
                            </div>
                        </div>

                        <nav className="flex-1 p-4 space-y-2 text-sm font-medium">
                            {role === 'admin' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>📊 Dashboard Admin</button>
                                    <button onClick={() => setActiveTab('users')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'users' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>👥 Data Pengguna Terdaftar</button>
                                    <button onClick={() => setActiveTab('classes')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'classes' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>🏫 Manajemen Kelas & Guru</button>
                                    <button onClick={() => setActiveTab('finance')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'finance' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>💰 Keuangan & Gaji</button>
                                </>
                            )}

                            {role === 'teacher' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>📊 Dashboard Guru</button>
                                    <button onClick={() => setActiveTab('students')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'students' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>👨‍🎓 List Murid & Pembayaran</button>
                                    <button onClick={() => setActiveTab('reports')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'reports' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>📝 Catatan & Laporan Bulanan</button>
                                    <button onClick={() => setActiveTab('salary')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'salary' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>💵 Status Pencairan Gaji</button>
                                    <button onClick={() => setActiveTab('chat')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'chat' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>💬 Chat dengan Peserta</button>
                                    <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'settings' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>⚙️ Pengaturan Akun</button>
                                </>
                            )}

                            {role === 'student' && (
                                <>
                                    <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>📊 Dashboard Peserta</button>
                                    <button onClick={() => setActiveTab('enroll')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'enroll' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>📖 Pendaftaran & Kelas Saya</button>
                                    <button onClick={() => setActiveTab('payment')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'payment' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>💳 Status Pembayaran Bulanan</button>
                                    <button onClick={() => setActiveTab('chat')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'chat' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>💬 Chat Admin & Guru</button>
                                    <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-2.5 rounded-xl transition ${activeTab === 'settings' ? 'bg-emerald-700' : 'hover:bg-emerald-700/50'}`}>⚙️ Pengaturan Akun</button>
                                </>
                            )}
                        </nav>

                        <div className="p-4 border-t border-emerald-700 space-y-2">
                            <button onClick={handleLogout} className="w-full bg-emerald-900 hover:bg-emerald-950 text-white py-2 rounded-xl text-xs font-semibold transition">
                                Keluar (Logout)
                            </button>
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col min-w-0">
                        <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shadow-sm">
                            <h2 className="font-bold text-lg text-emerald-900 capitalize">Tab: {activeTab}</h2>
                            <span className="text-sm text-gray-600">Login sebagai: <strong className="text-emerald-700">{user.email}</strong></span>
                        </header>

                        <main className="flex-1 p-6 overflow-y-auto">
                            {role === 'admin' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-6 rounded-3xl shadow-md">
                                        <h2 className="text-2xl font-bold mb-1">Panel Kendali Admin</h2>
                                        <p className="text-emerald-100 text-sm">Mengontrol seluruh aktivitas guru, peserta, kelas, laporan, dan keuangan.</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border">
                                            <div className="text-emerald-600 text-2xl font-bold mb-1">8 Guru</div>
                                            <div className="text-gray-500 text-sm">Jumlah Guru Aktif</div>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border">
                                            <div className="text-emerald-600 text-2xl font-bold mb-1">{allUsers.length} Pengguna</div>
                                            <div className="text-gray-500 text-sm">Total Akun Terdaftar</div>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border">
                                            <div className="text-emerald-600 text-2xl font-bold mb-1">6 Kelas</div>
                                            <div className="text-gray-500 text-sm">Kelas Aktif Berjalan</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {role === 'admin' && activeTab === 'users' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border">

                                                <tr className="border-b bg-gray-50 text-gray-600">

                                                    <th className="p-3">Email</th>
                                                    <th className="p-3">Role</th>
                                                    <th className="p-3">WhatsApp</th>
                                                    <th className="p-3">Gender</th>
                                                    <th className="p-3">Domisili</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {allUsers.map((u, i) => (
                                                    <tr key={i} className="border-b hover:bg-gray-50">
                                                        <td className="p-3 font-semibold">{u.full_name || '-'}</td>
                                                        <td className="p-3">{u.email}</td>
                                                        <td className="p-3 uppercase text-xs font-bold text-emerald-700">{u.role}</td>
                                                        <td className="p-3">{u.whatsapp || '-'}</td>
                                                        <td className="p-3">{u.gender || '-'}</td>
                                                        <td className="p-3">{u.city}, {u.province}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {role === 'teacher' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-6 rounded-3xl shadow-md">
                                        <h2 className="text-2xl font-bold mb-1">Dashboard Pengajar (Guru)</h2>
                                        <p className="text-teal-100 text-sm">Kelola murid, catatan pertemuan, laporan bulanan, dan status gaji.</p>
                                    </div>
                                </div>
                            )}

                            {role === 'student' && activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border">
                                        <h2 className="text-xl font-bold text-emerald-900 mb-1">Dashboard Peserta (Siswa)</h2>
                                        <p className="text-gray-500 text-sm">Pilih kelas tajwid, pantau status pembayaran, dan berinteraksi dengan guru.</p>
                                    </div>
                                </div>
                            )}

                            {/* Fitur Pengaturan & Hapus Akun khusus Guru dan Peserta */}
                            {(role === 'teacher' || role === 'student') && activeTab === 'settings' && (
                                <div className="bg-white p-6 rounded-2xl shadow-sm border max-w-xl space-y-6">
                                    <div>
                                        <h3 className="font-bold text-lg text-gray-800 mb-1">Pengaturan Akun</h3>
                                        <p className="text-gray-500 text-sm">Kelola preferensi akun dan data pribadi Anda.</p>
                                    </div>

                                    <div className="border-t pt-4 space-y-4">
                                        <div className="bg-red-50 border border-red-200 rounded-2xl p-5 space-y-3">
                                            <h4 className="font-bold text-red-700 text-sm">Zona Bahaya (Hapus Akun)</h4>
                                            <p className="text-xs text-gray-600">
                                                Tindakan ini akan menghapus seluruh data profil dan akses akun Anda dari sistem secara permanen.
                                            </p>
                                            <button 
                                                onClick={handleDeleteAccount}
                                                className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-sm"
                                            >
                                                Hapus Akun Saya
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
